name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt ruff
      # Syntax errors and pyflakes only: undefined names, unused imports and the like.
      - run: ruff check --select E9,F .
      # Fully offline: a fake Monash Hub, fake WeChat requests, and no test downloads a model or calls one.
      - run: python -m pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # Known vulnerabilities in what the server installs, including the optional RAG extras.
      - run: pip-audit -r requirements.txt -r requirements-rag.txt
