# nginx site for wxbot.secureview.tech - the 马莫百科 公众号 message callback.
#
# Only /mp is exposed: it is signature-checked by the bot (WXBOT_MP_TOKEN) and proxied to
# 127.0.0.1:8102. Everything else is 404. WeChat only calls ports 80/443.
#
# /health (optional, issue #3) is for an outside uptime check: 200 while the bot hears the owner, 503 when
# the ClawBot session expired or polling stopped - the moment the bot's own alerts cannot get out. It
# shows counts only (no user data). Remove the block to keep it local.

server {
    listen 80;
    listen [::]:80;
    server_name wxbot.secureview.tech;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wxbot.secureview.tech;

    access_log /var/log/nginx/wxbot.access.log;
    error_log  /var/log/nginx/wxbot.error.log;

    ssl_certificate     /etc/letsencrypt/live/wxbot.secureview.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wxbot.secureview.tech/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 64k;

    location = /mp {
        proxy_pass http://127.0.0.1:8102/mp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8102/health;
        proxy_read_timeout 5s;
        access_log off;
    }

    location / {
        return 404;
    }
}
